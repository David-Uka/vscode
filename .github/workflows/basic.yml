# File: .github/workflows/basic-checks.yml
name: Basic checks

on:
  workflow_dispatch:
    # (You can later add push/pr triggers if desired)
    # push:
    #   branches:
    #     - main
    # pull_request:
    #   branches:
    #     - main

permissions: {}

jobs:
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache_node.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node Cache (composite action)
        id: cache_node
        uses: ./.github/actions/node-cache
        with:
          node-version-file: .nvmrc

      - name: Upload Node setup artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v3
        with:
          name: node-setup
          path: |
            ~/.npm
            ~/.cache
            # Add other files if you need to reuse more from setup

  compile-and-test:
    needs: setup
    if: github.ref != 'refs/heads/main'
    name: Compilation, Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download Node setup artifact
        uses: actions/download-artifact@v3
        with:
          name: node-setup
          path: ~

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Build steps don’t need to re-run npm ci if cache hit
      - name: Compile & Download
        run: npm exec -- npm-run-all -lp compile "electron x64"

      - name: Run Unit Tests (Electron)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./scripts/test.sh

      - name: Run Integration Tests (Electron)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./scripts/test-integration.sh

  hygiene:
    needs: setup
    if: github.ref != 'refs/heads/main'
    name: Hygiene and Layering
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download Node setup artifact
        uses: actions/download-artifact@v3
        with:
          name: node-setup
          path: ~

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Hygiene Checks
        run: npm run gulp hygiene

      - name: Run Valid Layers Checks
        run: npm run valid-layers-check

      - name: Run Define Class Fields Checks
        run: npm run define-class-fields-check

      - name: Compile /build/
        run: npm run compile
        working-directory: build

      - name: Check clean git state
        run: ./.github/workflows/check-clean-git-state.sh

      - name: Run ESLint
        run: npm run eslint

      - name: Run VSCode DTS Compile Checks
        run: npm run vscode-dts-compile-check

      - name: Run Trusted Types Checks
        run: npm run tsec-compile-check

  sanity-on-main:
    if: github.ref == 'refs/heads/main'
    name: Sanity Check on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node (lockfile hash-based cache)
        uses: ./.github/actions/node-cache
        with:
          node-version-file: .nvmrc

      - name: Quick Lint Only
        run: npm run eslint
